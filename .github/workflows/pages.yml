name: Publicar Calculadora Renda Fixa Focus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Padronizar metadados do ícone iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text()
          s = re.sub(r"""<link[^>]+rel=["']apple-touch-icon["'][^>]*>""", "", s, flags=re.I)
          tags = '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">' + chr(10) + '<meta name="apple-mobile-web-app-title" content="Renda Fixa Focus">'
          s = re.sub(r"""<meta[^>]+name=["']apple-mobile-web-app-title["'][^>]*>""", "", s, flags=re.I)
          if "</head>" not in s:
              raise SystemExit("Não foi encontrado </head> no index.html")
          s = s.replace("</head>", tags + chr(10) + "</head>", 1)
          p.write_text(s)
          PY

      - name: Publicar arquivos na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          force_orphan: true
          exclude_assets: '.github'
